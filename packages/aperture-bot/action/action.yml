name: Aperture Bot
description: A coding bot for issues and pull requests that checks before it pushes. Comment /aperture and a task; it opens a pull request only when Aperture Agent Check is clear. Ask it a question and it answers on the thread; tick one of its suggestions and it does it. Comment /aperture check on a pull request, or run it on pull_request, for the check alone.
author: Hankaws
branding:
  icon: aperture
  color: purple
inputs:
  model-key:
    description: The model provider's API key, from a repository secret. It never reaches the code the bot runs. Checks (/aperture check, and pull_request runs) do not use it.
    required: true
  provider:
    description: grok, openai, anthropic, gemini, deepseek or custom.
    required: false
    default: grok
  base-url:
    description: For provider custom, an OpenAI-compatible endpoint.
    required: false
  model:
    description: For provider custom, the model to ask for.
    required: false
  github-token:
    description: Token for comments, pushes and pull requests. A personal or app token here lets the bot's pull requests start your CI.
    required: false
    default: ${{ github.token }}
  trigger:
    description: The word a comment starts with to ask the bot.
    required: false
    default: /aperture
  label:
    description: The label that, added to an issue by someone who can write, asks the bot to do what the issue says.
    required: false
    default: aperture
  scheduled:
    description: 'What to do when the workflow runs on its schedule or by hand: "fix-ci" fixes whatever is red on the default branch; "look-over" reports how the repository stands and what the bot would do next, changing nothing; any other text is a task to do each time. Empty: nothing.'
    required: false
  test-script:
    description: The package.json script that runs the tests.
    required: false
    default: test
  timeout-minutes:
    description: How long one test run may take.
    required: false
    default: "10"
  max-tokens:
    description: The run stops before a model call once it has used this many tokens.
    required: false
    default: "1000000"
  rounds:
    description: How many times Aperture Agent Check may run; each red result but the last goes back to the agent.
    required: false
    default: "2"
  pull-requests:
    description: 'What a push to a pull request starts, when the workflow listens for pull_request: "check" runs Aperture Agent Check (no model key); "review" posts a review with comments on the lines of likely bugs; "check, review" does both.'
    required: false
    default: check
  always-allow:
    description: 'Work the bot starts without a tick, comma-separated. "red": a workflow red on the default branch is explained and fixed at once. "brief": the daily brief''s first idea from the code is done at once, one pull request at a time (none while the last waits for review); ideas naming an issue still wait for a tick. Either opens a pull request only when Aperture Agent Check is clear. Empty: every fix waits for someone who can write to tick it.'
    required: false
  slack-webhook:
    description: 'A Slack incoming webhook (https://hooks.slack.com/services/…), from a repository secret: the daily brief, a red run the bot explained, and a pull request it opened unasked are posted to that channel too. Nothing from GitHub or the model can ping or link there. Empty: nothing goes to Slack.'
    required: false
  follow-threads:
    description: '"true": a reply to one of the bot''s replies needs no trigger. "Yes" or "do the second one" does that suggestion (checked as a tick is); anything else is answered, changing nothing. Only from whoever the reply answered (anyone who can write, on threads the bot started), and never a comment that @mentions someone. The workflow must also run on such comments: see the README.'
    required: false
  daily-limit:
    description: How many replies nobody asked for (to new issues, and to workflows red on the default branch) the bot posts in a day at most. Anyone can open an issue, and each reply spends the model key.
    required: false
    default: "20"
  install:
    description: '"auto" runs npm ci --ignore-scripts when there is a package-lock.json and no node_modules; "none" leaves installing to you.'
    required: false
    default: auto
  sandbox-image:
    description: The Docker image tests run in, with no network and no secrets.
    required: false
    default: mirror.gcr.io/library/node:22-slim
  working-directory:
    description: The project's folder, when it is not the repository root.
    required: false
outputs:
  outcome:
    description: clear, red, stopped, no-change, declined, ignored or error. A scheduled run with nothing to do (a green branch, a fix waiting for review) is ignored.
  pull-request:
    description: The pull request the bot opened, if it opened one.
  commit:
    description: The commit the bot pushed, if it pushed one.
  verdict:
    description: After a check, red or clear.
runs:
  using: node24
  main: dist/action.cjs
