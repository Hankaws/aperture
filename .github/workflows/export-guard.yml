name: Export guard

# Fails when a Grok export deletes source files, or when the branch was
# force-pushed. See scripts/export-guard.mjs for what it can and cannot see.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Grok export did not delete source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit in the push is inspected, so the history has to be here.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the guard uses only Node built-ins.
      - name: Check the pushed commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/export-guard.mjs "$BEFORE" "$AFTER"
